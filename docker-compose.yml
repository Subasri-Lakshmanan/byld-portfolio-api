version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: byld_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-portfoliodb}
      POSTGRES_USER: ${DB_USERNAME:-portfoliouser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-portfoliopass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-portfoliouser} -d ${DB_NAME:-portfoliodb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: byld_portfolio_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-portfoliodb}
      DB_USERNAME: ${DB_USERNAME:-portfoliouser}
      DB_PASSWORD: ${DB_PASSWORD:-portfoliopass}
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  postgres_data:
