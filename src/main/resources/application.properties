spring.application.name=portfolio-api

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portfoliodb}
spring.datasource.username=${DB_USERNAME:portfoliouser}
spring.datasource.password=${DB_PASSWORD:portfoliopass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - NEVER use ddl-auto=update in production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.enabled=true

# Logging
logging.level.com.byld=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] %-5level %logger{36} - %msg%n
